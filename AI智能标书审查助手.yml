  description: '基于大语言模型的智能招投标文件审查系统。


    支持自动解析PDF/Word标书文件，

    识别废标风险、实质性响应要求、企业资质要求、

    评分标准以及投标注意事项。


    自动生成结构化Markdown审查报告，

    并输出JSON数据供企业系统集成。'
