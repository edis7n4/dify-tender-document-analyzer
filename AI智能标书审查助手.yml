    - data:
        code: "import re\nimport json\n\nKEY_MAP = {\n    \"project_name\": \"项目名称\"\
          , \"bid_type\": \"标书类型\",\n    \"scan_summary\": \"扫描摘要\", \"overall_risk_level\"\
          : \"总体风险等级\",\n    \"risk_level\": \"总体风险等级\", \"rejection_clauses\": \"\
          废标条款\",\n    \"reject_items\": \"废标条款\", \"substantive_requirements\": \"\
          实质性响应要求\",\n    \"mandatory_requirements\": \"实质性响应要求\", \"qualification_requirements\"\
          : \"资质要求\",\n    \"key_deadlines\": \"关键时间节点\", \"ambiguous_or_exclusive\"\
          : \"模糊或排他性风险\",\n    \"source_section\": \"出处章节\", \"content\": \"原文要点\"\
          , \"consequence\": \"触发后果\",\n    \"suggestion\": \"规避建议\", \"category\"\
          : \"类别\", \"must_provide\": \"必须提供的响应材料\",\n    \"evidence_needed\": \"\
          需提供的证明材料\", \"node\": \"节点\", \"deadline\": \"时间\",\n    \"note\": \"备注\"\
          , \"description\": \"描述\", \"risk\": \"风险\", \"issue_id\": \"问题编号\",\n \
          \   \"clause_id\": \"条款编号\", \"req_id\": \"要求编号\", \"qual_id\": \"资质编号\"\
          ,\n    \"score_points\": \"评分要点\",\n}\n\ndef remap(d):\n    if not isinstance(d,\
          \ dict):\n        return d\n    out = {}\n    for k, v in d.items():\n \
          \       cn = KEY_MAP.get(k, k)\n        if isinstance(v, list):\n      \
          \      v = [remap(i) if isinstance(i, dict) else i for i in v]\n       \
          \ out[cn] = v\n    return out\n\ndef build_report(d):\n    if not isinstance(d,\
          \ dict):\n        return str(d)\n    L = []\n    L.append(\"# 标书智能解构与风险扫描报告\"\
          )\n    L.append(\"\")\n    info = [\n        (\"项目名称\", d.get(\"项目名称\",\
          \ \"\")),\n        (\"标书类型\", d.get(\"标书类型\", \"\")),\n        (\"总体风险等级\"\
          , d.get(\"总体风险等级\", \"未知\")),\n        (\"扫描摘要\", d.get(\"扫描摘要\", \"\")),\n\
          \    ]\n    L.append(\"## 一、扫描概览\")\n    L.append(\"\")\n    for k, v in\
          \ info:\n        if v:\n            L.append(f\"- **{k}**：{v}\")\n    L.append(\"\
          \")\n    sections = [\n        (\"废标条款\", \"二、废标条款（否决项）\"),\n        (\"\
          实质性响应要求\", \"三、实质性响应要求\"),\n        (\"资质要求\", \"四、资质要求\"),\n        (\"\
          关键时间节点\", \"五、关键时间节点\"),\n        (\"模糊或排他性风险\", \"六、模糊 / 排他性风险提示\"),\n\
          \        (\"评分要点\", \"七、评分要点\"),\n    ]\n    for key, title in sections:\n\
          \        items = d.get(key)\n        if not items:\n            continue\n\
          \        L.append(f\"## {title}\")\n        L.append(\"\")\n        if isinstance(items,\
          \ list) and items and isinstance(items[0], dict):\n            cols = []\n\
          \            for it in items:\n                for c in it.keys():\n   \
          \                 if c not in cols:\n                        cols.append(c)\n\
          \            L.append(\"| 序号 | \" + \" | \".join(cols) + \" |\")\n     \
          \       L.append(\"|------|\" + \"|\".join([\"------\"] * len(cols)) + \"\
          |\")\n            for i, it in enumerate(items, 1):\n                L.append(\"\
          | \" + str(i) + \" | \" + \" | \".join(str(it.get(c, \"\")) for c in cols)\
          \ + \" |\")\n        else:\n            L.append(\"| 序号 | 内容 |\")\n    \
          \        L.append(\"|------|------|\")\n            for i, it in enumerate(items,\
          \ 1):\n                L.append(f\"| {i} | {it} |\")\n        L.append(\"\
          \")\n    return \"\\n\".join(L)\n\ndef main(llm_output: str) -> dict:\n\
          \    data = {}\n    parse_error = \"\"\n    if not llm_output:\n       \
          \ return {\"parsed_json\": {}, \"formatted_json\": \"{}\",\n           \
          \     \"report_md\": \"# 标书智能解构与风险扫描报告\\n\\n（LLM 输出为空，无法生成报告）\",\n     \
          \           \"risk_level\": \"未知\", \"rejection_count\": 0, \"qual_count\"\
          : 0, \"parse_error\": \"LLM 输出为空\"}\n    try:\n        matches = re.findall(r\"\
          ```json\\s*([\\s\\S]*?)```\", llm_output, re.IGNORECASE)\n        raw =\
          \ matches[0].strip() if matches else llm_output.strip()\n        data =\
          \ json.loads(raw)\n    except Exception as e:\n        parse_error = f\"\
          解析失败: {str(e)} | 前200字: {llm_output[:200]}\"\n    data = remap(data) if\
          \ isinstance(data, dict) else {}\n    report_md = build_report(data)\n \
          \   rejection_clauses = data.get(\"废标条款\", []) if isinstance(data, dict)\
          \ else []\n    qualification_requirements = data.get(\"资质要求\", []) if isinstance(data,\
          \ dict) else []\n    return {\n        \"parsed_json\": data,\n        \"\
          formatted_json\": json.dumps(data, ensure_ascii=False, indent=2),\n    \
          \    \"report_md\": report_md,\n        \"risk_level\": data.get(\"总体风险等级\"\
          , \"未知\") if isinstance(data, dict) else \"未知\",\n        \"rejection_count\"\
          : len(rejection_clauses) if isinstance(rejection_clauses, list) else 0,\n\
          \        \"qual_count\": len(qualification_requirements) if isinstance(qualification_requirements,\
          \ list) else 0,\n        \"parse_error\": parse_error,\n    }\n"
        code_language: python3
